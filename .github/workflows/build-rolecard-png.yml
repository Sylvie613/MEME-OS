name: Build MÉMÉ OS role-card PNG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cards/meme_os_card_v0.4.1-alpha.json"
      - ".github/workflows/build-rolecard-png.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v0.4.1 PNG card
        run: |
          python -m pip install pillow
          python - <<'PY'
          import base64, json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, PngImagePlugin

          src_json = Path("cards/meme_os_card_v0.4.1-alpha.json")
          out_png = Path("cards/meme_os_card_v0.4.1-alpha.png")

          data = json.loads(src_json.read_text(encoding="utf-8"))
          payload = base64.b64encode(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          ).decode("ascii")

          W, H = 512, 768
          im = Image.new("RGB", (W, H), (227, 242, 247))
          d = ImageDraw.Draw(im)

          d.rounded_rectangle((42, 80, 470, 690), radius=34, fill=(249, 239, 247), outline=(255,255,255), width=3)
          purple = (73, 45, 104)

          bold = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          regular = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          f1 = ImageFont.truetype(bold, 72)
          f2 = ImageFont.truetype(regular, 26)
          f3 = ImageFont.truetype(bold, 22)
          f4 = ImageFont.truetype(regular, 21)

          def center(text, y, font):
              box = d.textbbox((0,0), text, font=font)
              x = (W - (box[2]-box[0])) / 2
              d.text((x,y), text, font=font, fill=purple)

          center("MÉMÉ OS", 230, f1)
          center("ADULT TRANSFORMATION SYSTEM", 330, f2)

          labels = ["ME", "TASK", "SHOP", "MEN"]
          xs = [78, 184, 294, 404]
          for x, label in zip(xs, labels):
              d.rounded_rectangle((x-38, 405, x+38, 455), radius=22, outline=purple, width=2)
              box = d.textbbox((0,0), label, font=f3)
              d.text((x-(box[2]-box[0])/2, 417), label, font=f3, fill=purple)

          center("v0.4.1-alpha", 560, f4)
          center("Sylvie × River", 600, f4)

          meta = PngImagePlugin.PngInfo()
          meta.add_text("chara", payload)
          meta.add_text("ccv3", payload)
          im.save(out_png, pnginfo=meta, optimize=True)
          PY

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/meme_os_card_v0.4.1-alpha.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build MÉMÉ OS v0.4.1-alpha PNG card"
          git push
